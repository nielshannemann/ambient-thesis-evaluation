[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ambient-artifact"
version = "0.1.0"
description = "Artifact package for AmbiEnt-style ambiguity experiments"
authors = [{name="Anonymous Authors"}]
dependencies = []

[project.scripts]
ambient = "ambient.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
